config_version = 12

[backdrop]
blur_intensity = 0.0
enabled = false
tint_intensity = 0.0

[bar]
order = [ "sidebar", "default" ]

    [bar.default]
    background_opacity = 0.4999999888241291
    contact_shadow = true
    end = [
        "cpu",
        "ram",
        "temp",
        "network_rx",
        "network_tx",
        "nix-monitor",
        "network",
        "battery",
        "settings",
        "session",
        "spacer_2"
    ]
    margin_ends = 0
    panel_overlap = 0
    radius = 0
    radius_bottom_left = 10
    radius_bottom_right = 15
    radius_top_right = 20
    start = [ "spacer_2", "audio_visualizer", "spacer_2" ]
    thickness = 27

    [bar.sidebar]
    background_opacity = 0.4999999888241291
    center = []
    contact_shadow = true
    enabled = true
    end = [
        "caffeine",
        "lid-guard",
        "mirror",
        "clipboard",
        "brightness",
        "volume",
        "bluetooth",
        "network",
        "battery",
        "control-center",
        "session"
    ]
    margin_ends = 0
    position = "left"
    radius = 0
    radius_bottom_left = 15
    radius_bottom_right = 20
    radius_top_right = 10
    thickness = 27

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1720.0
    cy = 1321.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 1081.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[plugins]
enabled = [ "8bury/lid-guard", "elijaharch/wl-screen-mirror", "avivbintangaringga/nix-monitor" ]

[shell.panel]
floating_offset = 0

[shell.screen_corners]
enabled = true
size = 30

[theme]
builtin = "Catppuccin"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[wallpaper]
transition_duration = 2000

    [wallpaper.default]
    path = "/home/jinji/Pictures/Wallpapers/img-2026-04-06_17-14-21.png.jpg"

    [wallpaper.last]
    path = "/home/jinji/Pictures/Wallpapers/img-2026-04-06_17-14-21.png.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/jinji/Pictures/Wallpapers/img-2026-04-06_17-14-21.png.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/jinji/Pictures/Wallpapers/img-2026-04-06_17-14-21.png.jpg"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.cpu]
show_label = false

[widget.lid-guard]
type = "8bury/lid-guard:lid-guard"

[widget.mirror]
type = "elijaharch/wl-screen-mirror:mirror"

[widget.network]
show_label = false

[widget.network_rx]
network_speed_unit = "mb"
show_label = false

[widget.network_tx]
network_speed_unit = "mb"
show_label = false

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.ram]
show_label = false

[widget.spacer_2]
length = 10
type = "spacer"

[widget.temp]
show_label = false

[widget.volume]
show_label = false
