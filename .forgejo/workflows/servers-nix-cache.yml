name: Build and publish server configurations

on:
  push:
    branches:
      - main
  schedule:
    # UTC 21:00 = JST 06:00 the following day.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      update_lock:
        description: Update flake.lock, build, publish, and push on success
        type: boolean
        default: false

concurrency:
  group: servers-nix-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && !inputs.update_lock
    runs-on: ryzen-servers-build
    timeout-minutes: 480
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://git.floating-gate.com
          persist-credentials: false

      - name: Verify commit and build systems and images
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          nix build --no-update-lock-file --max-jobs 1 --cores 14 \
            --print-out-paths --out-link result \
            .#nixosConfigurations.ryzen.config.system.build.toplevel \
            .#nixosConfigurations.rock3b.config.system.build.toplevel \
            .#nixosConfigurations.cubiea5e.config.system.build.toplevel \
            .#rock3b-image \
            .#cubiea5e-image > "$RUNNER_TEMP/servers-cache-paths"
          cat "$RUNNER_TEMP/servers-cache-paths"

      - name: Publish the signed closures
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/servers-cache-paths"
          mapfile -t paths < "$RUNNER_TEMP/servers-cache-paths"
          /run/wrappers/bin/sudo -n /run/current-system/sw/bin/nix-cache-publish \
            --group servers-config "${paths[@]}"

      - name: Verify public closure metadata and signatures
        run: |
          set -euo pipefail
          test -s modules/system/nix-cache.pub
          mapfile -t paths < "$RUNNER_TEMP/servers-cache-paths"
          nix store verify --no-contents --recursive --sigs-needed 1 \
            --store https://cache.floating-gate.com \
            --option trusted-public-keys "$(cat modules/system/nix-cache.pub)" \
            "${paths[@]}"

  update-lock:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.update_lock)
    runs-on: ryzen-servers-build
    timeout-minutes: 480
    permissions:
      contents: write
      statuses: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main with temporary push credentials
        # actions/checkout v4.2.2; credentials are removed by its post-job step.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://git.floating-gate.com
          persist-credentials: true

      - name: Update, build, publish, verify, then push
        env:
          CACHE_UPDATE_TOKEN: ${{ github.token }}
          CACHE_UPDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CACHE_UPDATE_REPOSITORY: jinji/servers-config
          CACHE_UPDATE_PUBLIC_KEY_FILE: modules/system/nix-cache.pub
          CACHE_UPDATE_CORES: '14'
        run: |
          PATH="/run/wrappers/bin:$PATH" nix shell --inputs-from . \
            nixpkgs#bash nixpkgs#coreutils nixpkgs#curl nixpkgs#gitMinimal nixpkgs#jq \
            --command bash scripts/update-nix-cache.sh \
              .#nixosConfigurations.ryzen.config.system.build.toplevel \
              .#nixosConfigurations.rock3b.config.system.build.toplevel \
              .#nixosConfigurations.cubiea5e.config.system.build.toplevel \
              .#rock3b-image \
              .#cubiea5e-image
