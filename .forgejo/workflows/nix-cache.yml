name: Check, build and publish all configurations

on:
  push:
    branches: [main]
  schedule:
    # UTC 06:00/18:00 = JST 15:00/03:00.
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      update_lock:
        description: Update flake.lock, build, publish, and push on success
        type: boolean
        default: false

concurrency:
  group: nixos-config-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && !inputs.update_lock
    runs-on: ryzen-nix-build
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://git.floating-gate.com
          persist-credentials: false

      - name: Verify commit, check and build all configurations
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          nix flake check --accept-flake-config --no-update-lock-file \
            --max-jobs 1 --cores 16
          mapfile -t targets < scripts/nix-cache-targets
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 1 --cores 16 --json --out-link result \
            "${targets[@]}" > "$RUNNER_TEMP/cache-build-results.json"
          nix shell --inputs-from . nixpkgs#jq -c jq -er \
            '[.[].outputs[]] | unique | .[]' "$RUNNER_TEMP/cache-build-results.json" \
            > "$RUNNER_TEMP/cache-paths"

      - name: Publish and verify the signed closures
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/cache-paths"
          mapfile -t paths < "$RUNNER_TEMP/cache-paths"
          /run/wrappers/bin/sudo -n /run/current-system/sw/bin/nix-cache-publish \
            --group nixos-config "${paths[@]}"
          test -s modules/system/nix/cache.pub
          nix store verify --no-contents --recursive --sigs-needed 1 \
            --store https://cache.floating-gate.com \
            --option trusted-public-keys "$(cat modules/system/nix/cache.pub)" \
            "${paths[@]}"

  update-lock:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.update_lock)
    runs-on: ryzen-nix-build
    timeout-minutes: 720
    permissions:
      contents: write
      statuses: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main with temporary push credentials
        # actions/checkout v4.2.2; credentials are removed by its post-job step.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://git.floating-gate.com
          persist-credentials: true

      - name: Update, build, publish, verify, then push
        env:
          CACHE_UPDATE_CORES: '16'
          CACHE_UPDATE_TOKEN: ${{ github.token }}
          CACHE_UPDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PATH="/run/wrappers/bin:$PATH" nix shell --inputs-from . \
            nixpkgs#bash nixpkgs#coreutils nixpkgs#curl nixpkgs#gitMinimal nixpkgs#jq \
            --command bash scripts/update-nix-cache.sh
