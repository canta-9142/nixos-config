name: Build and publish laptop configuration

on:
  push:
    branches: [main]
  schedule:
    # UTC 00:00/12:00 = JST 09:00/21:00.
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      update_lock:
        description: Update flake.lock, build, publish, and push on success
        type: boolean
        default: false

concurrency:
  group: laptop-nix-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && !inputs.update_lock
    runs-on: ryzen-nix-build
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://git.floating-gate.com
          persist-credentials: false

      - name: Verify commit and build laptop configuration
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 1 --cores 8 \
            .#nixosConfigurations.nixos.config.system.build.toplevel \
            --out-link result

      - name: Publish the signed closure
        run: |
          set -euo pipefail
          /run/wrappers/bin/sudo -n /run/current-system/sw/bin/nix-cache-publish \
            "$(readlink -f result)"

      - name: Verify public closure metadata and signatures
        run: |
          set -euo pipefail
          test -s hosts/laptop/nix-cache.pub
          nix store verify --no-contents --recursive --sigs-needed 1 \
            --store https://cache.floating-gate.com \
            --option trusted-public-keys "$(cat hosts/laptop/nix-cache.pub)" \
            "$(readlink -f result)"

  update-lock:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.update_lock)
    runs-on: ryzen-nix-build
    timeout-minutes: 360
    permissions:
      contents: write
      statuses: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main with temporary push credentials
        # actions/checkout v4.2.2; credentials are removed by its post-job step.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          github-server-url: https://git.floating-gate.com
          persist-credentials: true

      - name: Update, build, publish, verify, then push
        env:
          CACHE_UPDATE_TOKEN: ${{ github.token }}
          CACHE_UPDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: PATH="/run/wrappers/bin:$PATH" /run/current-system/sw/bin/nix-cache-update
